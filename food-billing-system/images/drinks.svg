<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="drinkbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0c3fc"/>
      <stop offset="100%" stop-color="#8ec5fc"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3e2723"/>
      <stop offset="100%" stop-color="#1a0c02"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#drinkbg)"/>
  <!-- Glass Cup -->
  <polygon points="150,70 250,70 230,220 170,220" fill="rgba(255, 255, 255, 0.4)" stroke="#ffffff" stroke-width="3"/>
  <!-- Drink Liquid -->
  <polygon points="156,100 244,100 228,215 172,215" fill="url(#liquid)"/>
  <!-- Ice cubes -->
  <rect x="180" y="115" width="22" height="22" rx="4" fill="rgba(255, 255, 255, 0.6)"/>
  <rect x="205" y="130" width="20" height="20" rx="4" fill="rgba(255, 255, 255, 0.6)"/>
  <!-- Whipped cream top -->
  <ellipse cx="200" cy="70" rx="48" ry="16" fill="#ffffff"/>
  <ellipse cx="200" cy="62" rx="34" ry="12" fill="#ffffff"/>
  <!-- Straw -->
  <line x1="215" y1="35" x2="185" y2="180" stroke="#e74c3c" stroke-width="8" stroke-linecap="round"/>
  <!-- Lemon Slice on Rim -->
  <circle cx="150" cy="70" r="22" fill="#f1c40f" stroke="#ffffff" stroke-width="2"/>
  <text x="200" y="270" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">Chilled Beverages</text>
</svg>
