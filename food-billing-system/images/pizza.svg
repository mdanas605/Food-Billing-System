<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="pizzabg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffecd2"/>
      <stop offset="100%" stop-color="#fcb69f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#pizzabg)"/>
  <!-- Pizza Slice -->
  <polygon points="200,60 110,210 290,210" fill="#f39c12"/>
  <path d="M105 210 Q200 230 295 210" stroke="#d35400" stroke-width="18" stroke-linecap="round" fill="none"/>
  <!-- Melted Cheese Layer -->
  <polygon points="200,80 125,200 275,200" fill="#f1c40f"/>
  <!-- Pepperoni / Tomato slices -->
  <circle cx="180" cy="130" r="14" fill="#c0392b"/>
  <circle cx="215" cy="165" r="15" fill="#c0392b"/>
  <circle cx="160" cy="180" r="13" fill="#c0392b"/>
  <!-- Basil Leaves -->
  <ellipse cx="205" cy="110" rx="6" ry="12" fill="#27ae60" transform="rotate(45 205 110)"/>
  <ellipse cx="235" cy="140" rx="6" ry="12" fill="#27ae60" transform="rotate(-30 235 140)"/>
  <text x="200" y="270" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">Artisanal Pizza</text>
</svg>
